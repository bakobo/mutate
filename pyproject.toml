[project]
name = "bakobo-mutate"
version = "0.0.0"
description = "Mutation-test the modules a repo changed, and file a tick per surviving mutant."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Bakobo" }]
# mutmut is deliberately not a dependency: the tool drives the target repo's own mutmut, in that
# repo's environment, against that repo's own suite.
dependencies = [
    "bakobo-errors @ git+https://github.com/bakobo/errors@cec417292463a6a4b9ff5485d2d01fb0eead100c",
]

[project.scripts]
bakobo-mutate = "bakobo_mutate.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bakobo_mutate"]

[tool.hatch.metadata]
# The bakobo-errors pin is a direct git reference.
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=bakobo_mutate --cov-branch --cov-report=term-missing --cov-fail-under=100"
