name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A run is bound to the commit that triggered it, so if that trigger's webhook is lost there is no
  # way to ask for a run on main after the fact without a fresh commit. This trigger is that way.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Run tests (100% branch coverage gate)
        run: uv run pytest
